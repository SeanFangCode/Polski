<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Polski">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<meta name="theme-color" content="#14171f" media="(prefers-color-scheme: dark)">

<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.4 system-ui,sans-serif;-webkit-text-size-adjust:100%}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Mów po polsku</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout: a worksheet-style study app. Header band with a paper-cut rosette, then group shelves of topic rows; a topic opens into a focused study surface with mode tabs. */
:root{
  --paper:#f6f5f2; --sheet:#ffffff; --ink:#1d2333; --ink-2:#555c6e; --rule:#e2e0da;
  --red:#c8102e; --red-ink:#ffffff; --red-soft:#fbe7ea; --green:#2f7a4f; --green-soft:#e3f1e8;
  --amber:#a66300; --amber-soft:#fbefd9; --flag-white:#ffffff; --cut-1:#c8102e; --cut-2:#2f7a4f; --cut-3:#1d2333;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --r:10px; --shadow:0 1px 2px rgb(29 35 51 / .06), 0 4px 16px rgb(29 35 51 / .06);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#14171f; --sheet:#1c2029; --ink:#eceae4; --ink-2:#a3a8b5; --rule:#2c313d;
  --red:#ef4a5f; --red-ink:#1a0006; --red-soft:#3a1a21; --green:#5cbf86; --green-soft:#18301f;
  --amber:#e7a94a; --amber-soft:#35290f; --flag-white:#f2efe8; --cut-1:#ef4a5f; --cut-2:#5cbf86; --cut-3:#eceae4;
  --shadow:0 1px 2px rgb(0 0 0 / .3), 0 4px 16px rgb(0 0 0 / .25); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#14171f; --sheet:#1c2029; --ink:#eceae4; --ink-2:#a3a8b5; --rule:#2c313d;
  --red:#ef4a5f; --red-ink:#1a0006; --red-soft:#3a1a21; --green:#5cbf86; --green-soft:#18301f;
  --amber:#e7a94a; --amber-soft:#35290f; --flag-white:#f2efe8; --cut-1:#ef4a5f; --cut-2:#5cbf86; --cut-3:#eceae4;
  --shadow:0 1px 2px rgb(0 0 0 / .3), 0 4px 16px rgb(0 0 0 / .25); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;padding-inline:16px;padding-block:0 48px}
.wrap{max-width:980px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--red);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.1}
.pl{font-family:var(--f-display);font-weight:700}
.muted{color:var(--ink-2)}
.label{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--ink-2)}
.num{font-variant-numeric:tabular-nums}

/* header */
.top{display:flex;align-items:center;gap:16px;padding-block:24px 20px;border-bottom:2px solid var(--ink);margin-bottom:24px;flex-wrap:wrap}
.rosette{width:64px;height:64px;flex:none}
.brand{flex:1;min-width:200px}
.brand h1{font-size:clamp(1.9rem,5vw,2.8rem);font-weight:800;letter-spacing:-.02em}
.brand h1 span{color:var(--red)}
.brand p{margin:4px 0 0;color:var(--ink-2)}
.stats{display:flex;gap:20px}
.stat b{display:block;font-family:var(--f-display);font-size:1.6rem;line-height:1}
.stat span{font-size:.8rem;color:var(--ink-2)}

/* home */
.continue{display:flex;gap:12px;align-items:center;justify-content:space-between;background:var(--ink);color:var(--paper);padding:16px 20px;border-radius:var(--r);margin-bottom:28px;flex-wrap:wrap}
.continue .label{color:inherit;opacity:.7}
.continue h3{font-size:1.3rem}
.btn{border:1.5px solid var(--ink);background:var(--sheet);border-radius:999px;padding:8px 16px;font-weight:700;display:inline-flex;align-items:center;gap:8px}
.btn.primary{background:var(--red);border-color:var(--red);color:var(--red-ink)}
.btn.ghost{background:transparent}
.continue .btn{border-color:var(--paper);background:var(--paper);color:var(--ink)}
.btn:disabled{opacity:.4;cursor:default}
.group{margin-bottom:36px}
.ghead{display:flex;align-items:end;gap:12px;justify-content:space-between;flex-wrap:wrap;margin-bottom:10px}
.ghead h2{font-size:1.5rem;font-weight:800}
.ghead .gpl{font-family:var(--f-display);color:var(--red);font-weight:700;font-size:.95rem;display:block;margin-bottom:2px}
.ghead-r{display:flex;align-items:center;gap:12px}
.bar{height:6px;background:var(--rule);border-radius:3px;overflow:hidden;width:100px}
.bar i{display:block;height:100%;background:var(--green);border-radius:3px}
.topics{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px}
.tcard{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:14px 16px;text-align:left;display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center;transition:border-color .15s, transform .15s}
.tcard:hover{border-color:var(--ink);transform:translateY(-1px)}
.tcard h3{font-size:1.05rem;font-weight:700}
.tcard .meta{font-size:.82rem;color:var(--ink-2);grid-column:1}
.ring{grid-row:1/3;grid-column:2;width:40px;height:40px}
.ring circle{fill:none;stroke-width:4}
.ring .bg{stroke:var(--rule)} .ring .fg{stroke:var(--green);stroke-linecap:round;transform:rotate(-90deg);transform-origin:center}
.ring text{font-size:11px;font-weight:700;fill:var(--ink);font-family:var(--f-body)}

/* topic view */
.back{background:none;border:0;padding:4px 0;color:var(--ink-2);font-weight:700;display:inline-flex;gap:6px;align-items:center;margin-bottom:8px}
.back:hover{color:var(--ink)}
.thead{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.thead h2{font-size:clamp(1.7rem,4vw,2.3rem);font-weight:800}
.thead .eps{margin-top:6px}
.tabs{display:flex;gap:4px;border-bottom:1.5px solid var(--rule);margin-bottom:20px;overflow-x:auto}
.tab{background:none;border:0;padding:10px 14px;font-weight:700;color:var(--ink-2);border-bottom:3px solid transparent;margin-bottom:-1.5px;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--red)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.seg{display:inline-flex;border:1.5px solid var(--ink);border-radius:999px;overflow:hidden}
.seg button{background:none;border:0;padding:6px 14px;font-weight:700;font-size:.9rem}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.spacer{flex:1}

/* worksheet */
.sheet{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.srow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr) auto auto;gap:12px;align-items:center;padding:10px 16px;border-top:1px solid var(--rule)}
.srow.h{border-top:0;padding-block:12px 8px}
.srow .en{min-width:0}
.srow .plw{min-width:0;font-size:1.1rem}
.srow.known .plw{color:var(--green)}
.know{width:26px;height:26px;border:2px solid var(--ink-2);border-radius:6px;background:none;display:grid;place-items:center;padding:0}
.know[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:var(--sheet)}
.speak{background:none;border:0;padding:4px;color:var(--ink-2);display:grid;place-items:center;border-radius:6px}
.speak:hover{color:var(--red)}
.speak[hidden]{display:none}
@media (max-width:560px){.srow{grid-template-columns:minmax(0,1fr) auto auto;}.srow .en{grid-column:1;font-size:.9rem;color:var(--ink-2)}.srow .plw{grid-column:1;grid-row:2}.srow .speak{grid-row:1/3;grid-column:2}.srow .know{grid-row:1/3;grid-column:3}.srow.h{display:none}}
.subhead{padding:14px 16px 6px;border-top:1px solid var(--rule)}

/* study surface */
.stage{max-width:620px;margin:0 auto}
.count{display:flex;justify-content:space-between;font-size:.9rem;color:var(--ink-2);margin-bottom:8px}
.card{position:relative;min-height:260px;background:var(--sheet);border:1px solid var(--rule);border-radius:16px;box-shadow:var(--shadow);display:grid;place-items:center;text-align:center;padding:32px 24px;cursor:pointer;width:100%}
.card .side{display:flex;flex-direction:column;gap:12px;align-items:center}
.card .big{font-family:var(--f-display);font-weight:700;font-size:clamp(1.5rem,5vw,2.3rem);line-height:1.15;overflow-wrap:anywhere}
.card .ans{font-family:var(--f-display);font-weight:700;font-size:clamp(1.3rem,4vw,1.9rem);color:var(--red);overflow-wrap:anywhere}
.card .hint{font-size:.85rem;color:var(--ink-2)}
.card .speak{position:absolute;top:12px;right:12px}
.card.flip{animation:flip .28s ease}
@keyframes flip{0%{transform:rotateX(0)}50%{transform:rotateX(80deg)}100%{transform:rotateX(0)}}
.actions{display:flex;gap:10px;justify-content:center;margin-top:16px;flex-wrap:wrap}
.btn.again{border-color:var(--amber);color:var(--amber)}
.btn.got{background:var(--green);border-color:var(--green);color:var(--sheet)}
.opts{display:grid;gap:10px;margin-top:16px}
.opt{text-align:left;background:var(--sheet);border:1.5px solid var(--rule);border-radius:var(--r);padding:12px 16px;font-size:1.05rem;display:flex;gap:12px;align-items:center}
.opt kbd{font-family:var(--f-body);font-size:.75rem;border:1px solid var(--rule);border-radius:4px;padding:1px 6px;color:var(--ink-2)}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt.right{border-color:var(--green);background:var(--green-soft)}
.opt.wrong{border-color:var(--red);background:var(--red-soft)}
.opt:disabled{cursor:default}
.prompt{background:var(--sheet);border:1px solid var(--rule);border-radius:16px;padding:28px 24px;text-align:center;box-shadow:var(--shadow);position:relative}
.prompt .big{font-family:var(--f-display);font-weight:700;font-size:clamp(1.4rem,4.5vw,2.1rem);line-height:1.2;overflow-wrap:anywhere}
.prompt .speak{position:absolute;top:10px;right:10px}
.typein{display:flex;gap:8px;margin-top:16px}
.typein input{flex:1;min-width:0;font:inherit;font-size:1.2rem;font-family:var(--f-display);padding:12px 14px;border:2px solid var(--ink);border-radius:var(--r);background:var(--sheet);color:var(--ink)}
.typein input.ok{border-color:var(--green)} .typein input.bad{border-color:var(--red)}
.keys{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;justify-content:center}
.keys button{width:40px;height:40px;border:1px solid var(--rule);background:var(--sheet);border-radius:8px;font-family:var(--f-display);font-weight:700;font-size:1.1rem}
.keys button:hover{border-color:var(--ink)}
.fb{margin-top:14px;padding:12px 16px;border-radius:var(--r);font-weight:700}
.fb.ok{background:var(--green-soft);color:var(--green)}
.fb.near{background:var(--amber-soft);color:var(--amber)}
.fb.bad{background:var(--red-soft);color:var(--red)}
.fb .pl{font-size:1.15rem}
.done{text-align:center;padding:32px 16px}
.done .score{font-family:var(--f-display);font-size:4rem;font-weight:800;line-height:1;color:var(--red)}
.empty{padding:24px;text-align:center;color:var(--ink-2)}

/* alphabet + verbs */
.alpha{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.letter{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:12px 14px;text-align:left;display:grid;gap:2px}
.letter:hover{border-color:var(--ink)}
.letter .L{font-family:var(--f-display);font-weight:800;font-size:2rem;line-height:1}
.letter .L.special{color:var(--red)}
.letter .s{font-size:.85rem;color:var(--ink-2)}
.letter .ex{font-family:var(--f-display);font-weight:700}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.vtab{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);overflow:hidden}
.vtab h3{padding:12px 16px;font-size:1.15rem;border-bottom:1px solid var(--rule);display:flex;justify-content:space-between;align-items:baseline}
.vtab h3 small{font-family:var(--f-body);font-weight:400;color:var(--ink-2);font-size:.85rem}
.vtab table{width:100%;border-collapse:collapse}
.vtab td{padding:6px 16px;border-top:1px solid var(--rule)}
.vtab tr:first-child td{border-top:0}
.vtab td.f{font-family:var(--f-display);font-weight:700;color:var(--red)}
.note{background:var(--sheet);border-left:4px solid var(--red);padding:12px 16px;border-radius:0 var(--r) var(--r) 0;margin-bottom:20px;max-width:70ch}
/* grammar */
mark.end{background:var(--red-soft);color:var(--red);border-radius:3px;padding:0 1px;font-weight:800}
.lesson{max-width:760px}
.lesson .lead{font-size:1.1rem;max-width:65ch;margin:0 0 24px}
.lesson section{margin-bottom:28px}
.lesson h3{font-size:1.25rem;margin-bottom:10px}
.lesson p{max-width:65ch;margin:0}
.tablewrap{overflow-x:auto;background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r)}
.gtable{width:100%;border-collapse:collapse;font-size:.95rem}
.gtable th{text-align:left;padding:10px 14px;font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);border-bottom:1.5px solid var(--rule);white-space:nowrap}
.gtable td{padding:9px 14px;border-top:1px solid var(--rule);vertical-align:top}
.gtable tr:first-child td{border-top:0}
.gtable td:first-child{font-weight:700}
.exlist{display:grid;gap:8px}
.ex{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;align-items:center;background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:10px 14px}
.ex .pl{font-size:1.1rem}
.ex .muted{grid-column:1;font-size:.9rem}
.ex .speak{grid-row:1/3;grid-column:2}
.gap{display:inline-block;min-width:3.2em;border-bottom:3px solid var(--red);margin:0 4px}
.gloss{margin-top:8px;color:var(--ink-2)}
.why{font-weight:400;color:var(--ink);margin-top:6px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:999px;font-weight:700;font-size:.9rem;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

</head>
<body>
<div class="wrap">
  <header class="top">
    <svg class="rosette" viewBox="0 0 64 64" aria-hidden="true">
      <defs>
        <path id="bub" d="M10 4h44a8 8 0 0 1 8 8v30a8 8 0 0 1-8 8H26l-12 10v-10h-4a8 8 0 0 1-8-8V12a8 8 0 0 1 8-8z"/>
        <clipPath id="cTop"><rect x="0" y="0" width="64" height="27"/></clipPath>
        <clipPath id="cBot"><rect x="0" y="27" width="64" height="40"/></clipPath>
      </defs>
      <use href="#bub" fill="var(--flag-white)"/>
      <use href="#bub" fill="var(--red)" clip-path="url(#cBot)"/>
      <use href="#bub" fill="none" stroke="var(--ink)" stroke-width="2.5" stroke-linejoin="round"/>
      <text x="32" y="38" text-anchor="middle" font-family="Bricolage Grotesque, system-ui, sans-serif" font-weight="800" font-size="34" fill="var(--red)" clip-path="url(#cTop)">ą</text>
      <text x="32" y="38" text-anchor="middle" font-family="Bricolage Grotesque, system-ui, sans-serif" font-weight="800" font-size="34" fill="var(--flag-white)" clip-path="url(#cBot)">ą</text>
    </svg>
    <div class="brand">
      <h1>Mów po <span>polsku</span></h1>
      <p id="sub">Words and phrases from your Talk Polish episodes</p>
    </div>
    <div class="stats">
      <div class="stat"><b class="num" id="sKnown">0</b><span>marked known</span></div>
      <div class="stat"><b class="num" id="sStreak">0</b><span>day streak</span></div>
    </div>
  </header>
  <main id="app"></main>
</div>
<div class="toast" id="toast" role="status"></div>

  ['Pogoda ___ ładna.','The weather was nice.',['była','był','było'],'{pogoda} is feminine.'],
 ]},

{id:'g-cases', title:'The 7 Cases at a Glance', intro:'Polish nouns change their ending depending on their job in the sentence. These forms are called cases. You don\'t need to memorise every table now. Learn to spot the trigger words, and the endings will start to feel familiar.',
 sections:[
  {h:'What triggers each case', table:{head:['Case','Answers','Common triggers','Example'],rows:[
    ['Nominative','who? what?','the subject; "to jest"','To jest {mam[a]}.'],
    ['Genitive','of whom? of what?','{do}, {bez}, {dla}, {z} (from), {nie ma}, amounts','bilet do {Krakow[a]}'],
    ['Dative','to whom?','giving, helping, thanking; {mi}, {ci}','Pomóż {m[i]}.'],
    ['Accusative','whom? what?','the object of {mam}, {lubię}, {chcę}, {poproszę}','Poproszę {kaw[ę]}.'],
    ['Instrumental','with whom? with what?','{z} (with), "jestem + noun", by means of','z {rodzin[ą]}'],
    ['Locative','about / where?','{w}, {na}, {o}, {po} for location or topic','w {Warszawi[e]}'],
    ['Vocative','calling someone','addressing a person','{Mam[o]}! {Pani Ann[o]}!']]}},
  {h:'One word in every case', table:{head:['Case','brat (brother)','mama (mum)','okno (window)'],rows:[
    ['Nominative','brat','mam[a]','okn[o]'],['Genitive','brat[a]','mam[y]','okn[a]'],['Dative','brat[u]','mam[ie]','okn[u]'],
    ['Accusative','brat[a]','mam[ę]','okn[o]'],['Instrumental','brat[em]','mam[ą]','okn[em]'],['Locative','braci[e]','mam[ie]','okni[e]'],['Vocative','braci[e]!','mam[o]!','okn[o]!']]}},
  {h:'Where to start', p:'The most useful cases for a beginner are accusative (ordering and wanting things), genitive (going to places, "without", "no") and locative (where you are). Each has its own lesson in this section.'},
 ],
 examples:[['Poproszę bilet do Berlin[a].','A ticket to Berlin, please.'],['Mieszkam w Warszawi[e].','I live in Warsaw.'],['Zapłacę kart[ą].','I\'ll pay by card.']],
 practice:[
  ['{do Krakowa} uses which case?','to Kraków',['Genitive','Locative','Accusative'],'{do} (to) always takes the genitive.'],
  ['{w Warszawie} uses which case?','in Warsaw',['Locative','Genitive','Instrumental'],'{w} meaning "in" a place takes the locative.'],
  ['{z rodziną} uses which case?','with the family',['Instrumental','Genitive','Dative'],'{z} meaning "with" takes the instrumental. The -ą ending gives it away.'],
  ['{Poproszę kawę} uses which case?','A coffee, please.',['Accusative','Nominative','Genitive'],'The thing you ask for is the object, so accusative. Feminine -a becomes -ę.'],
  ['{Mamo!} uses which case?','Mum!',['Vocative','Nominative','Dative'],'Calling someone uses the vocative.'],
  ['{bez mięsa} uses which case?','without meat',['Genitive','Accusative','Locative'],'{bez} (without) always takes the genitive.'],
  ['{To jest kuchnia} uses which case?','This is the kitchen.',['Nominative','Accusative','Locative'],'After "to jest" the noun stays in its dictionary form, the nominative.'],
  ['{Pomóż mi} uses which case?','Help me.',['Dative','Accusative','Genitive'],'You help "to" someone in Polish, so {pomóc} takes the dative.'],
 ]},

{id:'g-acc', title:'Accusative: Ordering & Wanting', intro:'Use the accusative for the thing you have, want, like, buy or ask for. You use it every time you order food: {Poproszę zupę i sałatkę}.',
 sections:[
  {h:'The rules', table:{head:['Noun type','Change','Examples'],rows:[
    ['Feminine (-a)','-a → -ę','{kaw[a]} → poproszę {kaw[ę]}; {zup[a]} → {zup[ę]}'],
    ['Masculine thing','no change','{bilet} → kupię {bilet}; {pokój} → zarezerwować {pokój}'],
    ['Masculine person or animal','add -a','{brat} → mam {brat[a]}; {pies} → mam {ps[a]}'],
    ['Neuter','no change','{mleko} → lubię {mleko}']]}},
  {h:'Adjectives follow along', p:'A feminine adjective changes from -a to -ą: {Poproszę czarną kawę} (A black coffee, please). A masculine adjective for a person changes to -ego: {Mam starszego brata} (I have an older brother).'},
  {h:'Watch out', p:'A few common verbs take the genitive instead: {szukać} (look for) and {potrzebować} (need). That\'s why your lists say {Szukam taksówki} and {Potrzebuję tłumacza}.'},
 ],
 examples:[['Poproszę zup[ę] i sałatk[ę].','I\'ll have the soup and the salad.'],['Poproszę kaw[ę].','A coffee, please.'],['Chcę wynająć przewodnik[a].','I want to hire a guide.'],['Chcę zarezerwować pokój.','I want to book a room.']],
 practice:[
  ['Poproszę ___.','A coffee, please. (kawa)',['kawę','kawa','kawy'],'Feminine -a becomes -ę.'],
  ['Mam ___.','I have a brother. (brat)',['brata','brat','bratem'],'Masculine people add -a.'],
  ['Chcę zarezerwować ___.','I want to book a room. (pokój)',['pokój','pokoju','pokoja'],'Masculine things don\'t change.'],
  ['Lubię ___.','I like tea. (herbata)',['herbatę','herbata','herbaty'],'Feminine -a becomes -ę.'],
  ['Kupię ___.','I\'ll buy a ticket. (bilet)',['bilet','biletu','bileta'],'Masculine things don\'t change.'],
  ['Masz ___?','Do you have a dog? (pies)',['psa','pies','psem'],'Animals count like people, so they add -a. The e drops out: {pies} → {psa}.'],
  ['Poproszę ___.','The soup and the salad, please. (zupa, sałatka)',['zupę i sałatkę','zupa i sałatka','zupy i sałatki'],'Both nouns are feminine, so both change -a to -ę.'],
  ['Widzę ___.','I can see the sea. (morze)',['morze','morza','morzu'],'Neuter nouns don\'t change.'],
 ]},

{id:'g-gen', title:'Genitive: To, Without, None', intro:'The genitive is the most common case after the nominative. You need it for going somewhere with {do}, for "without", for "there isn\'t any", and for amounts.',
 sections:[
  {h:'Trigger words', table:{head:['Trigger','Meaning','Example'],rows:[
    ['{do}','to (a place)','bilet do {Krakow[a]}, idę do {szkoł[y]}'],
    ['{bez}','without','bez {mięs[a]}'],
    ['{dla}','for','menu dla {dzieci}, prezent dla {mam[y]}'],
    ['{z}','from','jestem z {Polsk[i]}'],
    ['{nie} + verb','no, not any','nie mam {czas[u]}'],
    ['amounts','a glass of, a kilo of, more','szklanka {wod[y]}, więcej {chleb[a]}'],
    ['{szukać}, {potrzebować}','look for, need','szukam {taksówk[i]}']]}},
  {h:'Endings', table:{head:['Noun type','Ending','Examples'],rows:[
    ['Feminine (-a)','-y, or -i after k, g and soft letters','{wod[y]}, {szkoł[y]}, {Polsk[i]}, {kuchn[i]}'],
    ['Masculine','-a or -u','{Krakow[a]}, {brat[a]}, {chleb[a]}; {czas[u]}, {dom[u]}, {problem[u]}'],
    ['Neuter (-o, -e)','-a','{mięs[a]}, {mlek[a]}, {okn[a]}']]}},
  {h:'Masculine: -a or -u?', p:'People, animals, most towns and many everyday objects take -a. Most abstract ideas and many other things take -u. There\'s no perfect rule, so learn each one as you meet it. {do domu} (home) and {nie ma problemu} (no problem) are good ones to memorise.'},
  {h:'Negation flips the case', p:'When you negate a sentence, the object switches from accusative to genitive: {Mam samochód} → {Nie mam samochodu}. {Mam kawę} → {Nie mam kawy}.'},
 ],
 examples:[['Poproszę bilet do Krakow[a].','A ticket to Kraków, please.'],['Czy mogę to dostać bez mięs[a]?','Can I get this without meat?'],['Czy mogę prosić więcej chleb[a]?','Could I have some more bread?'],['Nie ma problem[u].','No problem.']],
 practice:[
  ['Bilet do ___.','A ticket to Kraków. (Kraków)',['Krakowa','Kraków','Krakowie'],'{do} takes the genitive, and towns usually take -a. The ó becomes o.'],
  ['Czy mogę to dostać bez ___?','Can I get this without meat? (mięso)',['mięsa','mięso','mięsem'],'{bez} takes the genitive. Neuter -o becomes -a.'],
  ['Nie mam ___.','I don\'t have time. (czas)',['czasu','czas','czasem'],'Negation takes the genitive, and {czas} takes -u.'],
  ['Szklanka ___.','A glass of water. (woda)',['wody','woda','wodę'],'Amounts take the genitive. Feminine -a becomes -y.'],
  ['Jestem z ___.','I\'m from Poland. (Polska)',['Polski','Polska','Polsce'],'{z} meaning "from" takes the genitive. After k the ending is -i.'],
  ['Idę do ___.','I\'m going to school. (szkoła)',['szkoły','szkole','szkołę'],'{do} takes the genitive: -a becomes -y.'],
  ['Nie mam ___.','I don\'t have a car. (samochód)',['samochodu','samochód','samochodzie'],'Negation flips the object to the genitive, and {samochód} takes -u.'],
  ['Szukam ___.','I\'m looking for a taxi. (taksówka)',['taksówki','taksówkę','taksówka'],'{szukać} takes the genitive. After k the ending is -i.'],
 ]},

{id:'g-loc', title:'Locative: Where You Are', intro:'The locative only appears after prepositions, mainly {w} (in), {na} (on, at) and {o} (about). You use it whenever you say where you are or what you\'re talking about.',
 sections:[
  {h:'Endings', table:{head:['Noun type','Ending','Examples'],rows:[
    ['Feminine (-a)','-e, often with a sound change','{Warszaw[a]} → w {Warszawi[e]}; {szkoł[a]} → w {szkol[e]}; {Polsk[a]} → w {Polsc[e]}'],
    ['Feminine (soft)','-y or -i','{prac[a]} → w {prac[y]}; {kuchni[a]} → w {kuchn[i]}; {restauracj[a]} → w {restauracj[i]}'],
    ['Masculine / neuter','-u after k, g, ch and soft letters','{dom} → w {dom[u]}; {pokój} → w {pokoj[u]}; {lotnisk[o]} → na {lotnisk[u]}; {pociąg} → w {pociąg[u]}'],
    ['Masculine / neuter','-e after most other letters, often with a sound change','{Kraków} → w {Krakowi[e]}; {sklep} → w {sklepi[e]}; {miast[o]} → w {mieści[e]}']]}},
  {h:'Sound changes', p:'Before -e, some consonants soften: ł → l (szkoła → szkole), k → c (Polska → Polsce), t → ci (miasto → mieście), r → rz (teatr → teatrze). Don\'t try to memorise these now. You\'ll start to hear them.'},
  {h:'w or na?', p:'Use {w} for inside enclosed places: {w domu}, {w pracy}, {w szkole}. Use {na} for open places, events and some fixed expressions: {na lotnisku}, {na dworcu}, {na poczcie}.'},
 ],
 examples:[['Mieszkam w Warszawi[e].','I live in Warsaw.'],['Czy w tym pociąg[u] jest Wi-Fi?','Is there Wi-Fi on this train?'],['Jestem w dom[u].','I\'m at home.'],['Nie chcę o ni[m] rozmawiać.','I don\'t want to talk about him.']],
 practice:[
  ['Mieszkam w ___.','I live in Warsaw. (Warszawa)',['Warszawie','Warszawy','Warszawę'],'Location after {w} takes the locative: -a becomes -ie.'],
  ['Jestem w ___.','I\'m at home. (dom)',['domu','domie','dom'],'{dom} takes -u in the locative.'],
  ['Czekam na ___.','I\'m waiting at the airport. (lotnisko)',['lotnisku','lotnisko','lotniska'],'After k the locative ending is -u.'],
  ['Pracuję w ___.','I work at a school. (szkoła)',['szkole','szkoły','szkołę'],'-a becomes -e, and ł softens to l.'],
  ['Czy w tym ___ jest Wi-Fi?','Is there Wi-Fi on this train? (pociąg)',['pociągu','pociągie','pociąga'],'After g the locative ending is -u.'],
  ['Jestem w ___.','I\'m at work. (praca)',['pracy','prace','pracę'],'{praca} has a soft stem, so the ending is -y.'],
  ['Mieszkam w ___.','I live in Poland. (Polska)',['Polsce','Polski','Polskie'],'-a becomes -e, and k softens to c.'],
  ['Rozmawiamy o ___.','We\'re talking about the film. (film)',['filmie','filmu','filmem'],'{o} (about) takes the locative. After m the ending is -ie.'],
 ]},

{id:'g-inst', title:'Instrumental: With & Being', intro:'The instrumental has three main jobs: "with" someone or something, how you do something (by card, by train), and saying what someone is after {jestem}.',
 sections:[
  {h:'Endings', table:{head:['Noun type','Ending','Examples'],rows:[
    ['Feminine (-a)','-ą','{rodzin[a]} → z {rodzin[ą]}; {kart[a]} → {kart[ą]}; {gotówk[a]} → {gotówk[ą]}'],
    ['Masculine','-em (-iem after k, g)','{brat} → z {brat[em]}; {autobus} → {autobus[em]}; {pociąg} → {pociąg[iem]}'],
    ['Neuter','-em (-iem after k, g)','{mlek[o]} → z {mlek[iem]}'],
    ['Plural','usually -ami','z {koleg[ami]} (with friends)']]}},
  {h:'Three everyday uses', table:{head:['Use','Example','Meaning'],rows:[
    ['with (after {z})','kawa z {mlek[iem]}','coffee with milk'],
    ['how / by means of','Zapłacę {kart[ą]}. Jadę {pociąg[iem]}.','I\'ll pay by card. I\'m going by train.'],
    ['being (after {jestem})','Jestem {Polak[iem]}. Jestem {Polk[ą]}.','I\'m Polish. (man / woman)']]}},
 ],
 examples:[['Zapłacę gotówk[ą].','I\'ll pay in cash.'],['Jestem Polk[ą].','I am Polish. (woman)'],['Wspaniałych świąt z rodzin[ą]!','Have a wonderful holiday with family!']],
 practice:[
  ['Zapłacę ___.','I\'ll pay by card. (karta)',['kartą','kartę','karty'],'"By means of" takes the instrumental: feminine -a becomes -ą.'],
  ['Kawa z ___.','Coffee with milk. (mleko)',['mlekiem','mleka','mleko'],'{z} meaning "with" takes the instrumental. After k it is -iem.'],
  ['Jadę ___.','I\'m going by train. (pociąg)',['pociągiem','pociągu','pociąg'],'Means of transport takes the instrumental. After g it is -iem.'],
  ['Jestem ___.','I am Polish. (said by a man: Polak)',['Polakiem','Polak','Polaka'],'After {jestem} + noun, use the instrumental.'],
  ['Idę z ___.','I\'m going with my brother. (brat)',['bratem','brata','bratu'],'{z} meaning "with" takes the instrumental: -em.'],
  ['Spędzam Wielkanoc z ___.','I\'m spending Easter with the family. (rodzina)',['rodziną','rodziny','rodzinę'],'Feminine -a becomes -ą.'],
  ['Ona jest ___.','She is a teacher. (nauczycielka)',['nauczycielką','nauczycielka','nauczycielkę'],'After a form of "to be" + noun, use the instrumental.'],
  ['Jadę ___.','I\'m going by bus. (autobus)',['autobusem','autobusu','autobus'],'Masculine nouns take -em.'],
 ]},

{id:'g-pron', title:'Me, You, Him: Pronoun Forms', intro:'Pronouns change by case too. Many of your phrases already use them: {Miło mi}, {Podoba mi się}, {Czy możesz mi pomóc?}, {Kocham cię}.',
 sections:[
  {h:'The forms you\'ll use most', table:{head:['Pronoun','object: "me"','"to me"','"with me"','"about me"'],rows:[
    ['ja (I)','mnie','mi','mną','mnie'],['ty (you)','cię','ci','tobą','tobie'],['on (he)','go','mu','nim','nim'],['ona (she)','ją','jej','nią','niej'],
    ['my (we)','nas','nam','nami','nas'],['wy (you all)','was','wam','wami','was'],['oni / one (they)','ich / je','im','nimi','nich']]}},
  {h:'Short and long forms', p:'Short forms like {mi}, {ci}, {cię}, {go} and {mu} are the everyday ones. Long forms ({mnie}, {tobie}, {ciebie}, {jego}, {jemu}) are used for emphasis, at the start of a sentence, or after a preposition: {Mnie również} (Me too), {dla ciebie} (for you).'},
  {h:'The n- after prepositions', p:'After a preposition, the "he", "she" and "they" forms start with n-: {dla niego}, {z nią}, {o nich}. Without a preposition: {widzę go}, {widzę ją}.'},
 ],
 examples:[['Miło m[i].','Nice to meet you. (literally: pleasant to me)'],['Podoba m[i] się twój dom.','I like your house. (literally: your house pleases me)'],['Życzę c[i] spokojnych Świąt.','I wish you a peaceful Christmas.'],['Nie chcę o ni[m] rozmawiać.','I don\'t want to talk about him.']],
 practice:[
  ['Czy możesz ___ pomóc?','Can you help me?',['mi','mnie','mną'],'{pomóc} takes the dative: "to me" is {mi}.'],
  ['Kocham ___.','I love you.',['cię','ci','tobą'],'The object "you" is {cię}.'],
  ['Idziesz ze ___?','Are you coming with me?',['mną','mi','mnie'],'"With me" is {ze mną}. The z becomes ze to make it easier to say.'],
  ['Życzę ___ Wesołych Świąt.','I wish you a Merry Christmas.',['ci','cię','ty'],'You wish something "to" someone: dative {ci}.'],
  ['Nie chcę o ___ rozmawiać.','I don\'t want to talk about him.',['nim','go','on'],'{o} takes the locative, with n-: {nim}.'],
  ['Widzę ___.','I can see her.',['ją','jej','ona'],'The object "her" is {ją}.'],
  ['Podoba ___ się.','I like it. (It pleases me.)',['mi','mnie','mną'],'Literally "it pleases to me", so dative {mi}.'],
  ['To prezent dla ___.','This is a present for them.',['nich','ich','im'],'{dla} takes the genitive. After a preposition use the n- form: {nich}.'],
 ]},

{id:'g-num', title:'Plurals & Counting', intro:'Polish counting has one quirky rule: the noun ending depends on the number. That\'s why your Basic Conversations list has {Mam... lat} for "I am... years old".',
 sections:[
  {h:'The counting rule', table:{head:['Number','Noun form','Example','Years'],rows:[
    ['1','singular','jeden {bilet}','1 {rok}'],
    ['2, 3, 4 (also 22–24, 32–34...)','plural','dwa {bilet[y]}','23 {lat[a]}'],
    ['5–21 (also 25–31...)','genitive plural','pięć {bilet[ów]}','25 {lat}']]}},
  {h:'Making plurals', table:{head:['Noun type','Plural ending','Examples'],rows:[
    ['Masculine / feminine, hard','-y, or -i after k and g','{bilet[y]}, {sklep[y]}, {książk[i]}'],
    ['Masculine / feminine, soft','-e','{pokoj[e]}, {kuchni[e]}, {ulic[e]}'],
    ['Neuter','-a','{okn[a]}, {łóżk[a]}, {jabłk[a]}'],
    ['Irregular','learn these','{dziecko} → {dzieci}; {człowiek} → {ludzie}; {rok} → {lata}']]}},
  {h:'Genitive plural', p:'This is the form after 5+, "how many" and "a kilo of". Masculine nouns usually add -ów: {biletów}, {domów}. Feminine and neuter nouns often just drop the ending, sometimes adding an e: {osoba} → {osób} (Ile osób? How many people?), {jabłko} → {jabłek} (kilogram jabłek).'},
  {h:'dwa or dwie?', p:'"Two" changes with gender: {dwa bilety} (masculine), {dwa piwa} (neuter), but {dwie kawy} (feminine).'},
 ],
 examples:[['Mam 25 lat.','I am 25 years old.'],['Mam 22 lat[a].','I am 22 years old.'],['Poproszę kilogram jabł[ek].','A kilo of apples, please.'],['Ile os[ób]?','How many people?']],
 practice:[
  ['Mam 30 ___.','I am 30 years old.',['lat','lata','rok'],'30 follows the 5+ rule, so genitive plural: {lat}.'],
  ['Mam 23 ___.','I am 23 years old.',['lata','lat','roku'],'Numbers ending in 2, 3 or 4 (except 12–14) take {lata}.'],
  ['Poproszę dwa ___.','Two tickets, please. (bilet)',['bilety','biletów','bilet'],'2, 3 and 4 take the ordinary plural.'],
  ['Pięć ___.','Five tickets. (bilet)',['biletów','bilety','bilet'],'5 and up take the genitive plural: masculine -ów.'],
  ['Kilogram ___.','A kilo of apples. (jabłko)',['jabłek','jabłka','jabłkami'],'Amounts take the genitive plural. {jabłko} drops its ending and adds e.'],
  ['Poproszę ___ kawy.','Two coffees, please.',['dwie','dwa','dwoje'],'{kawa} is feminine, so "two" is {dwie}.'],
  ['The plural of {okno} is…','windows',['okna','okny','okien'],'Neuter -o becomes -a in the plural.'],
  ['The plural of {książka} is…','books',['książki','książky','książke'],'After k, the plural ending is -i, not -y.'],
 ]},

{id:'g-basics', title:'Sentence Basics', intro:'A few small rules make your sentences sound natural: how to ask yes/no questions, where to put {nie}, double negatives, the little word {się}, and the polite {Pan} and {Pani}.',
 sections:[
  {h:'Questions with czy', p:'To turn a statement into a yes/no question, put {Czy} at the start: {Masz chwilę} → {Czy masz chwilę?} (Do you have a moment?). In speech you can also just raise your voice at the end.'},
  {h:'nie goes right before the verb', p:'{Nie rozumiem} (I don\'t understand), {Nie wiem} (I don\'t know), {Nie mów nikomu} (Don\'t tell anyone).'},
  {h:'Double negatives are correct', p:'With "nothing", "nobody" or "never" you still need {nie}: {Nic nie mam} (I have nothing), {Nikt nie wie} (Nobody knows), {Nigdy nie piję kawy} (I never drink coffee).'},
  {h:'The word się', p:'{się} means "oneself" and is part of many verbs: {nazywam się} (I am called), {spotykamy się} (we meet each other), {uczę się} (I\'m learning). It usually follows the verb, but it never starts a sentence.'},
  {h:'Being polite: Pan and Pani', p:'With strangers, shop staff and older people, use {Pan} (to a man) or {Pani} (to a woman) instead of {ty}. The verb takes the "he/she" form: {Co Pan poleca?} (What do you recommend?), {Czy może mi Pani pomóc?}. For a group, use {Państwo}.'},
 ],
 examples:[['Czy masz chwilę?','Do you have a moment?'],['Nie mów nikomu.','Don\'t tell anyone.'],['Nazywam się Anna.','My name is Anna.'],['Co Pan poleca?','What do you recommend? (to a man, polite)']],
 practice:[
  ['Which is the question "Do you have time?"','',['Czy masz czas?','Masz czy czas?','Czas masz czy?'],'{Czy} goes at the very start of a yes/no question.'],
  ['How do you say "I don\'t know"?','',['Nie wiem.','Wiem nie.','Ja wiem nie.'],'{nie} goes right before the verb.'],
  ['How do you say "Nobody knows"?','',['Nikt nie wie.','Nikt wie.','Nie nikt wie.'],'Polish uses a double negative: {nikt} + {nie}.'],
  ['How do you say "I have nothing"?','',['Nic nie mam.','Mam nic.','Nie mam coś.'],'"Nothing" needs {nie} with the verb.'],
  ['Ask a waiter politely: "What do you recommend?"','to a man',['Co Pan poleca?','Co Pan polecasz?','Co polecasz Pan?'],'With {Pan}, use the "he" form of the verb: {poleca}.'],
  ['How do you say "My name is Anna"?','',['Nazywam się Anna.','Się nazywam Anna.','Nazywam Anna.'],'{się} follows the verb and can\'t start a sentence.'],
  ['Ask a woman politely: "Can you help me?"','',['Czy może mi Pani pomóc?','Czy możesz mi Pani pomóc?','Czy Pani możesz mi pomóc?'],'With {Pani}, use the "she" form: {może}.'],
  ['How do you say "We meet on Monday"?','',['Spotykamy się w poniedziałek.','Się spotykamy w poniedziałek.','Spotykamy w poniedziałek.'],'{spotykać się} needs {się}, right after the verb.'],
 ]},
];

GROUPS.splice(1, 0, {id: 'grammar', name: 'Grammar & Word Endings', pl: 'Gramatyka', topics: GRAMMAR.map(g => ({id: g.id, title: g.title, eps: [], words: [], phrases: [], kind: 'grammar', g}))});
/* text markup: [x] → highlighted ending, {x} → Polish word */
const fmt = s => esc(s).replace(/\{([^}]*)\}/g, '<span class="pl">$1</span>').replace(/\[([^\]]*)\]/g, '<mark class="end">$1</mark>');
const plain = s => s.replace(/[\[\]{}]/g, '');
const isPhrase = (en, pl) => en.trim().split(/\s+/).length >= 4 || /[?!.…]$/.test(pl.trim()) || /\.\.\./.test(en);

const TOPICS = {}; let TOTAL = 0;
for (const g of GROUPS) for (const t of g.topics) {
  t.group = g;
  if (t.kind === 'verbs') {
    t.phrases = [];
    VERBS.forEach(v => PRON.forEach((p, i) => t.phrases.push([`${PRON_EN[i]} ${v.e[i]} (${v.inf})`, `${p} ${v.f[i]}`])));
  }
  if (t.kind === 'alphabet') {
    t.words = ALPHA.concat(DIGRAPHS).map(([l, s, ex]) => [`${s} — e.g. ${ex}`, l]);
  }
  const all = [];
  if (t.kind === 'grammar') for (const [q, gl, o, why] of t.g.practice) all.push({en: plain(q), pl: o[0], ph: false, q, gl, o, why});
  else for (const [en, pl] of t.words.concat(t.phrases)) all.push({en, pl, ph: t.kind === 'verbs' ? false : isPhrase(en, pl)});
  if (t.kind === 'verbs') all.forEach((x, i) => x.ph = i >= t.words.length);
  all.forEach((x, i) => { x.id = t.id + ':' + i; x.t = t; });
  t.all = all; if (t.kind !== 'grammar') TOTAL += all.length; TOPICS[t.id] = t;
}

/* ---------- storage ---------- */
const store = {
  get(k, d) { try { const v = localStorage.getItem('mpp:' + k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem('mpp:' + k, JSON.stringify(v)); } catch {} },
};
let known = store.get('known', {});
let last = store.get('last', null);
let streak = store.get('streak', {n: 0, day: null});
const today = () => new Date().toISOString().slice(0, 10);
function touchStreak() {
  const d = today(); if (streak.day === d) return;
  const y = new Date(Date.now() - 864e5).toISOString().slice(0, 10);
  streak = {n: streak.day === y ? streak.n + 1 : 1, day: d}; store.set('streak', streak); updateStats();
}
function setKnown(id, v) { if (v) known[id] = 1; else delete known[id]; store.set('known', known); touchStreak(); updateStats(); }
const knownIn = list => list.filter(x => known[x.id]).length;
function updateStats() {
  $('#sKnown').textContent = Object.keys(known).filter(k => TOPICS[k.split(':')[0]]).length.toLocaleString();
  const d = today(), y = new Date(Date.now() - 864e5).toISOString().slice(0, 10);
  $('#sStreak').textContent = (streak.day === d || streak.day === y) ? streak.n : 0;
}

/* ---------- speech ---------- */
let plVoice = null; const canSpeak = 'speechSynthesis' in window;
function pickVoice() {
  try {
    const vs = speechSynthesis.getVoices().filter(v => /^pl/i.test(v.lang));
    const rank = v => /natural/i.test(v.name) ? 0 : /online|neural/i.test(v.name) ? 1 : /premium|enhanced/i.test(v.name) ? 2 : /google/i.test(v.name) ? 3 : 4;
    plVoice = vs.sort((a, b) => rank(a) - rank(b))[0] || null;
  } catch {}
}
if (canSpeak) { pickVoice(); try { speechSynthesis.onvoiceschanged = pickVoice; } catch {} }
function say(text) {
  if (!canSpeak) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text.replace(/\//g, ', ').replace(/\.{2,}|…/g, ' '));
    u.lang = 'pl-PL'; if (plVoice) u.voice = plVoice; u.rate = .9;
    speechSynthesis.speak(u);
    if (!plVoice) toast('No Polish voice found. Add one in your device’s speech settings.');
  } catch {}
}
const speakBtn = (text, label = 'Hear it') => canSpeak ? `<button class="speak" data-say="${esc(text)}" aria-label="${label}" title="${label}">${ICON_SPEAK}</button>` : '';
document.addEventListener('click', e => { const b = e.target.closest('[data-say]'); if (b) { e.stopPropagation(); say(b.dataset.say); } }, true);

let toastT; function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2200); }

/* ---------- answer checking ---------- */
const strip = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/ł/g, 'l').replace(/Ł/g, 'L');
const norm = s => s.toLowerCase().replace(/\([^)]*\)/g, ' ').replace(/[.,!?¿¡;:"“”„'’…]/g, ' ').replace(/\s+/g, ' ').trim();
function variants(pl) {
  let out = [''];
  for (const tok of pl.replace(/\([^)]*\)/g, ' ').split(/\s+/).filter(Boolean)) {
    const opts = tok.includes('/') ? tok.split('/') : [tok];
    const next = []; for (const o of out) for (const p of opts) next.push((o + ' ' + p).trim());
    out = next.slice(0, 64);
  }
  out.push(pl); return [...new Set(out.map(norm))];
}
function check(input, pl) {
  const a = norm(input); if (!a) return 'empty';
  const vs = variants(pl);
  if (vs.includes(a)) return 'ok';
  if (vs.some(v => strip(v) === strip(a))) return 'near';
  return 'bad';
}

/* ---------- routing ---------- */
let view = {name: 'home'};
function go(v) { view = v; render(); window.scrollTo({top: 0}); }
function render() {

}

/* ---------- home ---------- */
function ring(pct) {
  const r = 16, c = 2 * Math.PI * r;
  return `<svg class="ring" viewBox="0 0 40 40" aria-hidden="true"><circle class="bg" cx="20" cy="20" r="${r}"/><circle class="fg" cx="20" cy="20" r="${r}" stroke-dasharray="${c * pct} ${c}"/><text x="20" y="24" text-anchor="middle">${Math.round(pct * 100)}</text></svg>`;
}
function homeHTML() {
  let h = '';
  const lt = last && (last.mix ? GROUPS.find(g => g.id === last.mix) : TOPICS[last.t]);
  if (lt) h += `<div class="continue"><div><div class="label">Pick up where you left off</div><h3>${esc(last.mix ? lt.name + ' · mixed review' : lt.title)}</h3></div><button class="btn" data-go-last>Continue</button></div>`;
  for (const g of GROUPS) {
    const items = g.topics.flatMap(t => t.all), k = knownIn(items);
    h += `<section class="group"><div class="ghead"><div><span class="gpl">${esc(g.pl)}</span><h2>${esc(g.name)}</h2></div>
      <div class="ghead-r"><span class="muted num" style="font-size:.85rem">${k} / ${items.length}</span><div class="bar"><i style="width:${items.length ? k / items.length * 100 : 0}%"></i></div>
      <button class="btn ghost" data-mix="${g.id}">Mixed review</button></div></div><div class="topics">`;
    for (const t of g.topics) {
      const kk = knownIn(t.all), w = t.all.filter(x => !x.ph).length, p = t.all.length - w;
      if (t.kind === 'grammar') { h += `<button class="tcard" data-topic="${t.id}"><h3>${esc(t.title)}</h3>${ring(t.all.length ? kk / t.all.length : 0)}<span class="meta">Lesson · ${t.all.length} practice questions</span></button>`; continue; }
      const parts = []; if (w) parts.push(`${w} ${t.kind === 'alphabet' ? 'letters' : t.kind === 'verbs' ? 'pronouns' : 'words'}`); if (p) parts.push(`${p} ${t.kind === 'verbs' ? 'verb forms' : 'phrases'}`);
      h += `<button class="tcard" data-topic="${t.id}"><h3>${esc(t.title)}</h3>${ring(t.all.length ? kk / t.all.length : 0)}<span class="meta">${parts.join(' · ')} · Ep. ${t.eps.map(e => String(e).replace(/ \(.*\)/, '')).join(', ')}</span></button>`;
    }
    h += '</div></section>';
  }
  return h;
}

/* ---------- topic / mix view ---------- */
let mode = 'sheet', dir = 'en', filter = 'all', session = null;
function pool() {
  if (view.mix) {
    const g = GROUPS.find(g => g.id === view.mix);
    let items = g.topics.filter(t => t.kind !== 'alphabet').flatMap(t => t.all);
    const unk = items.filter(x => !known[x.id]);
    return shuffle(unk.length >= 10 ? unk : items).slice(0, 30);
  }
  const t = TOPICS[view.t];
  return t.all.filter(x => filter === 'all' || (filter === 'ph') === x.ph);
}
function topicHTML() {
  const mix = !!view.mix, t = mix ? null : TOPICS[view.t], g = mix ? GROUPS.find(g => g.id === view.mix) : t.group;
  const gram = mix ? g.id === 'grammar' : t.kind === 'grammar';
  const modes = gram ? (mix ? [['practice','Practice']] : [['lesson','Lesson'],['practice','Practice']])
    : mix ? [['cards','Flashcards'],['quiz','Quiz'],['type','Type it']]

    : t.kind === 'verbs' ? [['tables','Conjugations'],['sheet','Worksheet'],['cards','Flashcards'],['quiz','Quiz'],['type','Type it']]
    : [['sheet','Worksheet'],['cards','Flashcards'],['quiz','Quiz'],['type','Type it']];
  if (!modes.some(m => m[0] === mode)) mode = modes[0][0];

  return `<button class="back" data-home>← All topics</button>

    <h2>${mix ? 'Mixed review' : esc(t.title)}</h2>
    <div class="eps muted">${gram ? (mix ? 'Questions from every grammar lesson, favouring the ones you have not answered correctly yet' : `Grammar guide · ${knownIn(t.all)} of ${t.all.length} practice questions answered correctly`) : mix ? 'Up to 30 items from across this group, favouring the ones you have not marked known' : `From episode${t.eps.length > 1 ? 's' : ''} ${t.eps.map(e => '#' + String(e).replace(/ \(.*\)/, '')).join(' and ')} · ${knownIn(t.all)} of ${t.all.length} known`}</div></div></div>
  <div class="tabs" role="tablist">${modes.map(([k, l]) => `<button class="tab" role="tab" aria-selected="${k === mode}" data-mode="${k}">${l}</button>`).join('')}</div>
  <div class="toolbar" id="toolbar">
    ${hasBoth && !['letters','tables'].includes(mode) ? `<div class="seg" aria-label="Show">${[['all','All'],['w',lbl[0]],['ph',lbl[1]]].map(([k, l]) => `<button aria-pressed="${filter === k}" data-filter="${k}">${l}</button>`).join('')}</div>` : ''}
    ${['cards','quiz'].includes(mode) && !(t && t.kind === 'alphabet') ? `<div class="seg" aria-label="Direction"><button aria-pressed="${dir === 'en'}" data-dir="en">English → Polish</button><button aria-pressed="${dir === 'pl'}" data-dir="pl">Polish → English</button></div>` : ''}
    <span class="spacer"></span>
    ${['cards','quiz','type','practice'].includes(mode) ? '<button class="btn ghost" data-restart>Shuffle &amp; restart</button>' : ''}
  </div>
  <div id="mode"></div>`;
}

function mountMode() {
  const el = $('#mode');
  last = view.mix ? {mix: view.mix} : {t: view.t}; store.set('last', last);
  if (mode === 'sheet') return sheet(el);
  if (mode === 'letters') return letters(el);
  if (mode === 'tables') return tables(el);
  if (mode === 'lesson') return lesson(el);
  session = {items: shuffle(pool()), i: 0, score: 0, flipped: false, answered: false, missed: []};
  if (mode === 'practice') { if (view.mix) session.items = session.items.slice(0, 12); session.qs = session.items; return practice(el); }
  if (mode === 'cards') return cards(el);

/* worksheet */
function sheet(el) {
  const items = pool();
  if (!items.length) { el.innerHTML = '<div class="empty">Nothing here with this filter.</div>'; return; }
  const row = x => `<div class="srow ${known[x.id] ? 'known' : ''}" data-row="${x.id}"><div class="en">${esc(x.en)}</div><div class="plw pl">${esc(x.pl)}</div>${speakBtn(x.pl)}<button class="know" aria-pressed="${!!known[x.id]}" aria-label="I know this: ${esc(x.pl)}" data-know="${x.id}">${known[x.id] ? ICON_CHECK : ''}</button></div>`;
  const ws = items.filter(x => !x.ph), ps = items.filter(x => x.ph);
  const t = TOPICS[view.t], lbl = t.kind === 'verbs' ? ['Pronouns', 'Verb forms'] : ['Words', 'Phrases'];
  let h = `<div class="sheet"><div class="srow h"><span class="label">English</span><span class="label">Polish</span><span></span><span class="label">Know?</span></div>`;
  if (ws.length && ps.length) h += `<div class="subhead label">${lbl[0]}</div>` + ws.map(row).join('') + `<div class="subhead label">${lbl[1]}</div>` + ps.map(row).join('');
  else h += items.map(row).join('');
  el.innerHTML = h + '</div>';
}
document.addEventListener('click', e => {
  const k = e.target.closest('[data-know]'); if (!k) return;
  const id = k.dataset.know, v = !known[id]; setKnown(id, v);
  k.setAttribute('aria-pressed', v); k.innerHTML = v ? ICON_CHECK : '';
  k.closest('.srow').classList.toggle('known', v);
  const t = TOPICS[view.t]; if (t) { const e2 = document.querySelector('.thead .eps'); if (e2) e2.textContent = `From episode${t.eps.length > 1 ? 's' : ''} ${t.eps.map(e => '#' + String(e).replace(/ \(.*\)/, '')).join(' and ')} · ${knownIn(t.all)} of ${t.all.length} known`; }
});

/* alphabet */
function letters(el) {

  const special = new Set(['ą','ć','ę','ł','ń','ó','ś','ź','ż']);
  el.innerHTML = `<p class="note">Polish has 32 letters. The nine in red don't exist in English. There's no q, v or x in native words. Stress almost always falls on the second-to-last syllable. ${canSpeak ? 'Tap a letter to hear it with its example word.' : ''}</p>
  <div class="alpha">${ALPHA.map(a => cell(a, special.has(a[0]))).join('')}</div>
  <h3 style="margin:28px 0 12px;font-size:1.3rem">Letter pairs</h3><p class="muted" style="margin:-6px 0 14px">Two letters, one sound. Spotting these makes long words much easier to read.</p>
  <div class="alpha">${DIGRAPHS.map(a => cell(a, false)).join('')}</div>`;
}
/* verbs */
function tables(el) {
  el.innerHTML = `<p class="note">Polish verbs change their ending for each person, so the pronoun is often dropped: <span class="pl">mam</span> already means "I have". Most verbs ending in <span class="pl">-ać</span> follow the same pattern as <span class="pl">czytać</span>: -am, -asz, -a, -amy, -acie, -ają.</p>
  <div class="vgrid">${VERBS.map(v => `<div class="vtab"><h3><span class="pl">${v.inf}</span><small>${v.en}</small></h3><table>${PRON.map((p, i) => `<tr><td>${p}</td><td class="f">${v.f[i]}</td><td class="muted" style="font-size:.85rem">${PRON_EN[i]} ${v.e[i]}</td><td style="width:36px;padding:0 8px">${speakBtn(p + ' ' + v.f[i])}</td></tr>`).join('')}</table></div>`).join('')}</div>`;
}

/* grammar practice */
function practice(el) {
  const s = session;
  if (!s.items.length) { el.innerHTML = '<div class="empty">No practice questions here yet.</div>'; return; }
  if (s.i >= s.qs.length) return finish(el, `${s.score} of ${s.qs.length} correct.`, s.missed.length ? `Retry the ${s.missed.length} you missed` : null, true);

   <div class="prompt">${view.mix ? `<div class="label" style="margin-bottom:6px">${esc(x.t.title)}</div>` : `<div class="label" style="margin-bottom:6px">${hasGap ? 'Fill the gap' : 'Choose the answer'}</div>`}
     <div class="big ${hasGap ? 'pl' : ''}" style="${hasGap ? '' : 'font-size:clamp(1.15rem,3.5vw,1.5rem)'}">${fmt(x.q).replace('___', '<span class="gap" aria-label="blank">&nbsp;</span>')}</div>
     ${x.gl ? `<div class="gloss">${esc(x.gl)}</div>` : ''}</div>
   <div class="opts">${s.opts.map((o, i) => `<button class="opt ${/^[A-Z][a-z]+$/.test(o) && !hasGap ? '' : 'pl'}" data-popt="${i}"><kbd>${i + 1}</kbd><span>${esc(o)}</span></button>`).join('')}</div>

}
function practicePick(i) {
  const s = session; if (s.answered || !s.opts || s.opts[i] == null) return;
  s.answered = true; const x = s.qs[s.i], ok = s.opts[i] === x.pl;
  document.querySelectorAll('.opt').forEach((b, j) => { b.disabled = true; if (s.opts[j] === x.pl) b.classList.add('right'); else if (j === i) b.classList.add('wrong'); });
  if (ok) { s.score++; setKnown(x.id, true); } else { s.missed.push(x); if (known[x.id]) setKnown(x.id, false); }
  const full = x.q.includes('___') ? plain(x.q).replace('___', x.pl) : null;
  $('#pfb').innerHTML = `<div class="fb ${ok ? 'ok' : 'bad'}">${ok ? 'Dobrze! That’s right.' : `Not quite. The answer is <span class="pl">${esc(x.pl)}</span>.`}

  if (full) say(full);

  $('#qnext button').focus();
}
function practiceNext() { const s = session; s.i++; s.opts = null; s.answered = false; practice($('#mode')); }

function cardAnswer(got) {

/* quiz */
function quiz(el) {
  const s = session;
  if (s.items.length < 2) { el.innerHTML = '<div class="empty">Not enough items for a quiz with this filter.</div>'; return; }

  const x = s.qs[s.i];
  if (!s.opts) {
    const src = view.mix ? s.items : x.t.all;
    let others = shuffle(src.filter(y => y !== x && y.ph === x.ph && y.pl !== x.pl && y.en !== x.en));
    if (others.length < 3) others = others.concat(shuffle(src.filter(y => y !== x && !others.includes(y) && y.pl !== x.pl)));
    s.opts = shuffle([x, ...others.slice(0, 3)]);
  }
  const q = dir === 'en' ? x.en : x.pl, ans = y => dir === 'en' ? y.pl : y.en;
  el.innerHTML = `<div class="stage"><div class="count"><span class="num">Question ${s.i + 1} of ${s.qs.length}</span><span class="num">${s.score} correct</span></div>
   <div class="prompt">${dir === 'pl' ? speakBtn(x.pl) : ''}<div class="label" style="margin-bottom:6px">${dir === 'en' ? 'How do you say' : 'What does this mean?'}</div><div class="big ${dir === 'pl' ? 'pl' : ''}">${esc(q)}</div></div>
   <div class="opts">${s.opts.map((o, i) => `<button class="opt ${dir === 'en' ? 'pl' : ''}" data-opt="${i}"><kbd>${i + 1}</kbd><span>${esc(ans(o))}</span></button>`).join('')}</div>
   <div class="actions" id="qnext"></div></div>`;
}
function quizPick(i) {
  const s = session; if (s.answered || !s.opts || !s.opts[i]) return;
  s.answered = true; const x = s.qs[s.i], ok = s.opts[i] === x;
  document.querySelectorAll('.opt').forEach((b, j) => { b.disabled = true; if (s.opts[j] === x) b.classList.add('right'); else if (j === i) b.classList.add('wrong'); });
  if (ok) { s.score++; } else s.missed.push(x);
  say(x.pl);
  $('#qnext').innerHTML = `<button class="btn primary" data-next>${s.i + 1 < s.qs.length ? 'Next question' : 'See results'} →</button>`;
  $('#qnext button').focus();
}
function quizNext() { const s = session; s.i++; s.opts = null; s.answered = false; quiz($('#mode')); }

/* type it */
const KEYS = ['ą','ć','ę','ł','ń','ó','ś','ź','ż'];
function typeit(el) {
  const s = session;
  if (!s.items.length) { el.innerHTML = '<div class="empty">Nothing to practise with this filter.</div>'; return; }
  if (!s.qs) s.qs = s.items.slice(0, Math.min(10, s.items.length));
  if (s.i >= s.qs.length) return finish(el, `${s.score} of ${s.qs.length} typed correctly.`, s.missed.length ? `Retry the ${s.missed.length} you missed` : null, true);
  const x = s.qs[s.i];
  el.innerHTML = `<div class="stage"><div class="count"><span class="num">${s.i + 1} of ${s.qs.length}</span><span class="num">${s.score} correct</span></div>
   <div class="prompt"><div class="label" style="margin-bottom:6px">Write in Polish</div><div class="big">${esc(x.en)}</div></div>
   <form class="typein" id="tf"><input id="ti" autocomplete="off" autocapitalize="off" spellcheck="false" lang="pl" placeholder="Type the Polish…" aria-label="Your answer in Polish"><button class="btn primary" id="tbtn">Check</button></form>
   <div class="keys">${KEYS.map(k => `<button type="button" data-key="${k}">${k}</button>`).join('')}</div>
   <div id="tfb"></div></div>`;
  const inp = $('#ti'); inp.focus();
  $('#tf').onsubmit = e => {
    e.preventDefault();
    if (s.answered) return typeNext();
    const r = check(inp.value, x.pl); if (r === 'empty') { inp.focus(); return; }
    s.answered = true; inp.readOnly = true;
    inp.classList.add(r === 'bad' ? 'bad' : 'ok');
    if (r !== 'bad') s.score++; else s.missed.push(x);
    const msg = r === 'ok' ? 'Dobrze! That’s right.' : r === 'near' ? 'Almost. Check the accents:' : 'Not quite. The answer is:';
    $('#tfb').innerHTML = `<div class="fb ${r}">${msg}${r !== 'ok' ? `<div class="pl" style="margin-top:4px">${esc(x.pl)} ${speakBtn(x.pl)}</div>` : ''}</div>`;
    say(x.pl);
    $('#tbtn').textContent = s.i + 1 < s.qs.length ? 'Next →' : 'See results';
  };
}
function typeNext() { const s = session; s.i++; s.answered = false; typeit($('#mode')); }

function finish(el, text, retryLabel, scored) {
  const s = session, n = scored ? s.qs.length : s.items.length, pct = scored ? Math.round(s.score / n * 100) : null;
  touchStreak();
  el.innerHTML = `<div class="stage"><div class="card" style="cursor:default"><div class="done">
    ${scored ? `<div class="score num">${pct}%</div>` : '<div class="score">Gotowe!</div>'}
    <p style="font-size:1.1rem">${text}</p>
    ${s.missed.length ? `<p class="muted">Still learning: ${s.missed.slice(0, 6).map(m => `<span class="pl" style="color:var(--ink)">${esc(m.pl)}</span>`).join(', ')}${s.missed.length > 6 ? '…' : ''}</p>` : ''}
    <div class="actions">${retryLabel ? `<button class="btn primary" data-retry>${retryLabel}</button>` : ''}<button class="btn" data-restart>Start a new round</button></div></div></div></div>`;
}
function retryMissed() {
  const m = session.missed; session = {items: shuffle(m), i: 0, score: 0, flipped: false, answered: false, missed: []};
  const el = $('#mode'); if (mode === 'practice') { session.qs = session.items; practice(el); return; } if (mode === 'cards') cards(el); else if (mode === 'quiz') { session.qs = session.items; quiz(el); } else { session.qs = session.items; typeit(el); }
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const t = e.target.closest('button,[data-topic]'); if (!t) return;
  const d = t.dataset;
  if (d.topic) { filter = 'all'; const k = TOPICS[d.topic].kind; mode = k === 'alphabet' ? 'letters' : k === 'verbs' ? 'tables' : k === 'grammar' ? 'lesson' : 'sheet'; go({name: 'topic', t: d.topic}); }
  else if (d.mix) { mode = d.mix === 'grammar' ? 'practice' : 'cards'; go({name: 'topic', mix: d.mix}); }
  else if (d.popt) practicePick(+d.popt);
  else if ('pnext' in d) practiceNext();
  else if ('goLast' in d) { mode = last.mix ? (last.mix === 'grammar' ? 'practice' : 'cards') : (TOPICS[last.t].kind === 'grammar' ? 'lesson' : 'sheet'); go(last.mix ? {name: 'topic', mix: last.mix} : {name: 'topic', t: last.t}); }
  else if ('home' in d) go({name: 'home'});
  else if (d.mode) { mode = d.mode; render(); }
  else if (d.filter) { filter = d.filter; render(); }
  else if (d.dir) { dir = d.dir; render(); }
  else if ('restart' in d) mountMode();
  else if (d.card) { if (d.card === 'flip') flipCard(); else cardAnswer(d.card === 'got'); }
  else if (d.opt) quizPick(+d.opt);
  else if ('next' in d) quizNext();
  else if ('retry' in d) retryMissed();
  else if (d.key) { const i = $('#ti'); if (i && !i.readOnly) { const p = i.selectionStart ?? i.value.length; i.value = i.value.slice(0, p) + d.key + i.value.slice(i.selectionEnd ?? p); i.focus(); i.setSelectionRange(p + 1, p + 1); } }
});
document.addEventListener('keydown', e => {
  if (view.name === 'home' || e.target.tagName === 'INPUT' || e.metaKey || e.ctrlKey || e.altKey) return;
  if (mode === 'cards' && session) {
    if (e.key === ' ' || e.key === 'Enter') { if (!session.flipped) { e.preventDefault(); flipCard(); } }
    else if (session.flipped && (e.key === 'ArrowRight' || e.key === '2')) cardAnswer(true);
    else if (session.flipped && (e.key === 'ArrowLeft' || e.key === '1')) cardAnswer(false);
  } else if (mode === 'practice' && session) {
    if (/^[1-4]$/.test(e.key)) practicePick(+e.key - 1);
    else if (e.key === 'Enter' && session.answered) { e.preventDefault(); practiceNext(); }
  } else if (mode === 'quiz' && session) {
    if (/^[1-4]$/.test(e.key)) quizPick(+e.key - 1);
    else if (e.key === 'Enter' && session.answered) { e.preventDefault(); quizNext(); }
  }
});


$('#sub').textContent = `${TOTAL.toLocaleString()} words and phrases from your Talk Polish episodes, plus a grammar guide`;
updateStats();
render();
</script>

<script>
if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>
</body>
